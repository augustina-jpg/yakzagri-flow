name: CI

# Frontend-only CI: lint, build, unit tests, a11y, and visual regression
# for the Next.js application. The backend/contracts/mobile gates live in
# the yakzagri-flow backend repository.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci.yml"
      - "frontend/**"
      - "pnpm-lock.yaml"

jobs:
  changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'frontend/pnpm-lock.yaml'

  frontend-quality:
    name: Frontend Lint, Types & Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enforce pnpm-only lockfile
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json || -f yarn.lock ]]; then
            echo "Only pnpm-lock.yaml may be committed in frontend/."
            exit 1
          fi

      - name: Design tokens in sync
        working-directory: frontend
        run: node scripts/design-tokens.mjs --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify generated design tokens
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm tokens:check

      - name: Lint
        run: pnpm lint

      - name: Undefined Tailwind colour guard
        if: needs.changes.outputs.frontend == 'true'
        run: node scripts/check-tailwind-colors.mjs

      - name: Env example keys in sync
        if: needs.changes.outputs.frontend == 'true'
        run: node scripts/check-env-example.mjs

      - name: Type check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test --ci --json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

      - name: Bundle size budget check
        run: pnpm bundle:check

  frontend:
    name: Frontend Required Gate
    runs-on: ubuntu-latest
    needs: [changes, frontend-quality, frontend-test, frontend-build]
    if: always()
    steps:
      - name: Verify frontend jobs
        if: needs.changes.result != 'success' || (needs.changes.outputs.frontend == 'true' && (needs.frontend-quality.result != 'success' || needs.frontend-test.result != 'success' || needs.frontend-build.result != 'success'))
        run: exit 1

      - name: Skip note (no frontend file changes)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "No frontend file changes detected, required gate passed."

  visual-regression:
    name: Visual Regression (Playwright)
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Detect committed snapshot baselines
        id: baselines
        run: |
          if git ls-files 'tests/visual/**/*.png' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No baselines committed yet
        if: steps.baselines.outputs.present != 'true'
        run: echo "No committed Playwright baselines under frontend/tests/visual — the visual gate is a no-op until baselines are committed (see frontend/tests/visual/SNAPSHOT_POLICY.md)."

      - name: Setup pnpm
        if: steps.baselines.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node
        if: steps.baselines.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        if: steps.baselines.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers (Chromium only)
        if: steps.baselines.outputs.present == 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Route smoke and accessibility audit
        run: pnpm exec playwright test --project=e2e-chromium tests/e2e/routes-accessibility.spec.ts
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build Next.js app
        if: steps.baselines.outputs.present == 'true'
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_API_VERSION_PREFIX: /api/v1

      - name: Run visual regression suite
        if: steps.baselines.outputs.present == 'true'
        run: pnpm exec playwright test --project=chromium-desktop --project=chromium-mobile tests/visual
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
          NEXT_PUBLIC_API_VERSION_PREFIX: /api/v1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore
